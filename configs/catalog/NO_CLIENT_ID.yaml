code: NO_CLIENT_ID
title_ru: "Приём наличных без предъявления документа клиента"
group: cashops
verdict_impact: true
timecode_policy: omission_due  # момент передачи денег
# Описание = шаблон (str.format_map по фактам правила) + правовая фраза, которую добавляет pipeline/legal/describe.py.
template_ru: "В {t_handoff} с клиент передаёт наличные, кассир их принимает. С момента входа клиента ({t_enter} с) предъявление документа, удостоверяющего личность, в кадре не наблюдается."
required_facts: [t_handoff, t_enter]
