# STORAGE_UNESCORTED — запись каталога v0 (P0-S0-05).
# Источник: docs/violation_catalog.md, раздел 3.3; нормы и сила — docs/legal_sources.md, раздел 5.2.
# title_ru — строка type для жюри, после сдачи не меняется. Шаблон, факты и вопрос VLM правит владелец кода, нормы — S5.
code: STORAGE_UNESCORTED
title_ru: "Доступ к зоне хранения ценностей без сопровождения"
group: access
verdict_impact: true
timecode_policy: event  # вход в зону сейфа
# Описание = шаблон (str.format_map по фактам правила) + правовая фраза, которую добавляет pipeline/legal/describe.py.
template_ru: "В {t_zone} с человек, не являющийся кассиром, подходит к сейфу. Кассир в это время находится {cashier_where_ru}."
# cashier_where_ru: «за столом» | «у счётной машинки» | «у двери»
required_facts: [t_zone, cashier_where_ru]
vlm_question_ru: "Посторонний человек подходит к сейфу, а кассир его не сопровождает?"
pdf_items: [39]
owner: S4
# Первая запись — основная: её пункт идёт в описание жюри. Фраза (docs/legal_sources.md, раздел 6.2):
# «Может свидетельствовать о несоблюдении п. 75 <cite_ru PKO>.»
legal:
  - act_code: PKO
    act_title_ru: "Правила осуществления кассовых операций и операций по инкассации банкнот, монет и ценностей в банках второго уровня, филиалах банков-нерезидентов Республики Казахстан, Национальном операторе почты и юридических лицах, исключительной деятельностью которых является инкассация банкнот, монет и ценностей"
    clause: "п. 75"
    quote_ru: "Вход в кладовую и (или) сейфовую комнату разрешается лицам, ответственным за сохранность наличных денег, а также лицам на основании распорядительного документа руководителя банка при сопровождении лиц, ответственных за сохранность наличных денег."
    url: "https://adilet.zan.kz/rus/docs/V1900019680"
    strength: indirect
    note_ru: "Предложение S5: применимо только к кладовой или сейфовой комнате, рабочий сейф кассы ей не равен; полномочия по внешности не установить."
