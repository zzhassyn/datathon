# title_ru — строка type для жюри, после сдачи не меняется. Шаблон, факты и вопрос VLM правит владелец кода, нормы — S5.
code: CASH_WITHHELD
title_ru: "Выдача неполной суммы / утаивание части наличных"
group: cashops
verdict_impact: true
timecode_policy: event  # момент разделения пачки
# Описание = шаблон (str.format_map по фактам правила) + правовая фраза, которую добавляет pipeline/legal/describe.py.
template_ru: "В {t_split} с, после пересчёта на машинке, кассир делит пачку на две части. Клиенту передаётся одна часть, вторая остаётся у кассира и уходит из зоны стола."
required_facts: [t_split]
vlm_question_ru: "Кассир передаёт клиенту только часть пересчитанных денег, а другая часть остаётся у кассира и убирается не в сейф и не клиенту?"
