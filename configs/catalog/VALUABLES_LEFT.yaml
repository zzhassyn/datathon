# VALUABLES_LEFT — запись каталога v0 (P0-S0-05).
# Источник: docs/violation_catalog.md, раздел 2.7; нормы и сила — docs/legal_sources.md, раздел 5.1.
# title_ru — строка type для жюри, после сдачи не меняется. Шаблон, факты и вопрос VLM правит владелец кода, нормы — S5.
code: VALUABLES_LEFT
title_ru: "Ценности оставлены без присмотра при уходе"
group: leave
verdict_impact: true
timecode_policy: exit  # подтверждённый уход кассира
# Описание = шаблон (str.format_map по фактам правила) + правовая фраза, которую добавляет pipeline/legal/describe.py.
template_ru: "В {t_exit} с кассир покидает рабочее место. На столе без присмотра остаются {items_ru}."
# items_ru: «наличные» | «инкассаторская сумка» | «наличные и инкассаторская сумка»
required_facts: [t_exit, items_ru]
vlm_question_ru: "После ухода кассира на столе остаются деньги или инкассаторская сумка, и рядом никого нет?"
pdf_items: [7, 8, 10]
owner: S4
# Первая запись — основная: её пункт идёт в описание жюри. Фраза (docs/legal_sources.md, раздел 6.2):
# «Основание: п. 20 ч. 2 <cite_ru PKO>.»
legal:
  - act_code: PKO
    act_title_ru: "Правила осуществления кассовых операций и операций по инкассации банкнот, монет и ценностей в банках второго уровня, филиалах банков-нерезидентов Республики Казахстан, Национальном операторе почты и юридических лицах, исключительной деятельностью которых является инкассация банкнот, монет и ценностей"
    clause: "п. 20 ч. 2"
    quote_ru: "Все ранее принятые наличные деньги хранятся в специальных устройствах, находящихся на рабочем месте кассового работника, закрывающихся на ключ"
    url: "https://adilet.zan.kz/rus/docs/V1900019680"
    strength: direct
    note_ru: "П. 20 касается ранее принятых наличных; для инкассаторской сумки (Х-15) порядок хранения задаёт внутренний регламент (список команды, пп. 7, 8)."
  - act_code: PKO
    act_title_ru: "Правила осуществления кассовых операций и операций по инкассации банкнот, монет и ценностей в банках второго уровня, филиалах банков-нерезидентов Республики Казахстан, Национальном операторе почты и юридических лицах, исключительной деятельностью которых является инкассация банкнот, монет и ценностей"
    clause: "п. 22"
    quote_ru: "Кассовому работнику не допускается покидать рабочее место до окончания обслуживания клиента."
    url: "https://adilet.zan.kz/rus/docs/V1900019680"
    strength: direct
    note_ru: "Только если уход во время обслуживания клиента."
    applies_if: during_service
  - act_code: PKO
    act_title_ru: "Правила осуществления кассовых операций и операций по инкассации банкнот, монет и ценностей в банках второго уровня, филиалах банков-нерезидентов Республики Казахстан, Национальном операторе почты и юридических лицах, исключительной деятельностью которых является инкассация банкнот, монет и ценностей"
    clause: "п. 80"
    quote_ru: "ключей от специальных устройств, находящихся на рабочем месте кассового работника, предназначенных для хранения наличных денег (металлический шкаф, сейф, тележка, ящики стола), определяется внутренними документами банка, обеспечивающими исключение их несанкционированного использования"
    url: "https://adilet.zan.kz/rus/docs/V1900019680"
    strength: indirect
    note_ru: "Только если на столе видны печати или ключи (прочтение Х-24)."
    applies_if: seals_or_keys_visible
