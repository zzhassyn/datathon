legal:
  - act_code: POP
    act_title_ru: "Правила организации охраны и устройства помещений банков второго уровня, филиалов банков-нерезидентов Республики Казахстан, Национального оператора почты, юридических лиц, исключительной деятельностью которых является инкассация банкнот, монет и ценностей, и юридических лиц, осуществляющих деятельность исключительно через обменные пункты на основании лицензии Национального Банка Республики Казахстан на обменные операции с наличной иностранной валютой"
    clause: "п. 8"
    quote_ru: "Кассовый узел подлежит изолированию от других производственных, подсобных, подвальных и служебных помещений одним закрывающимся служебным входом."
    url: "https://adilet.zan.kz/rus/docs/V2000020075"
    strength: indirect
    note_ru: "Общего запрета посторонних в обычной кассе банка в актах нет. Полномочия вошедшего по внешности не определить (список команды, п. 13)."
  - act_code: POP
    act_title_ru: "Правила организации охраны и устройства помещений банков второго уровня, филиалов банков-нерезидентов Республики Казахстан, Национального оператора почты, юридических лиц, исключительной деятельностью которых является инкассация банкнот, монет и ценностей, и юридических лиц, осуществляющих деятельность исключительно через обменные пункты на основании лицензии Национального Банка Республики Казахстан на обменные операции с наличной иностранной валютой"
