required_facts: [t_enter, behaviour_ru]
vlm_question_ru: "Вошедший человек проходит к рабочему месту кассира или остаётся в кассе, не являясь обслуживаемым клиентом или инкассатором?"
pdf_items: [13]
owner: S4
# Первая запись — основная: её пункт идёт в описание жюри. Фраза (docs/legal_sources.md, раздел 6.2):
