# UNATTENDED_PRESENCE — запись каталога v0 (P0-S0-05).
# Источник: docs/violation_catalog.md, раздел 3.8; нормы и сила — docs/legal_sources.md, раздел 9.
# title_ru — строка type для жюри, после сдачи не меняется. Шаблон, факты и вопрос VLM правит владелец кода, нормы — S5.
code: UNATTENDED_PRESENCE
title_ru: "Доступ другого лица к наличным или сейфу в отсутствие кассира"
group: leave
verdict_impact: true
timecode_policy: event  # первое касание или вход в зону кассира
# Описание = шаблон (str.format_map по фактам правила) + правовая фраза, которую добавляет pipeline/legal/describe.py.
template_ru: "Кассира нет на рабочем месте с {t_absent} с. В {t_contact} с другой человек {action_ru}."
# action_ru: «берёт наличные со стола» | «открывает сейф» | «находится у стола, на котором лежат наличные»
required_facts: [t_absent, t_contact, action_ru]
vlm_question_ru: "Пока кассира нет, другой человек трогает деньги или открывает сейф?"
pdf_items: []
owner: S4
# Первая запись — основная: её пункт идёт в описание жюри. Фраза (docs/legal_sources.md, раздел 6.2):
# «Прямой нормы нет; пункт <cite_ru PKO> не определён (FAQ 31); требуется проверка человеком.»
legal:
  - act_code: PKO
    act_title_ru: "Правила осуществления кассовых операций и операций по инкассации банкнот, монет и ценностей в банках второго уровня, филиалах банков-нерезидентов Республики Казахстан, Национальном операторе почты и юридических лицах, исключительной деятельностью которых является инкассация банкнот, монет и ценностей"
    clause: null
    quote_ru: null
    url: "https://adilet.zan.kz/rus/docs/V1900019680"
    strength: none
    note_ru: "Ссылка на уровне акта без пункта (FAQ 31): готового сопоставления «тип → норма» в analysis/case_analysis.md, раздел 7, нет (docs/legal_sources.md, раздел 9). До решения S5. Кандидаты: п. 20 ч. 2 (оставлены наличные) или п. 22 (идёт обслуживание), косвенно; ПОП п. 8 — только строка в интерфейсе."
