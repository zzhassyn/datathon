# PC_UNLOCKED — запись каталога v0 (P0-S0-05).
# Источник: docs/violation_catalog.md, раздел 2.10; нормы и сила — docs/legal_sources.md, раздел 5.1.
# title_ru — строка type для жюри, после сдачи не меняется. Шаблон, факты и вопрос VLM правит владелец кода, нормы — S5.
code: PC_UNLOCKED
title_ru: "Уход с рабочего места без блокировки компьютера"
group: leave
verdict_impact: true
timecode_policy: exit  # подтверждённый уход кассира
# Описание = шаблон (str.format_map по фактам правила) + правовая фраза, которую добавляет pipeline/legal/describe.py.
template_ru: "В {t_exit} с кассир покидает рабочее место. Экран ноутбука остаётся включённым и не заблокированным ещё {active_sec} с после ухода."
required_facts: [t_exit, active_sec]
vlm_question_ru: "На кадрах после ухода сотрудника экран ноутбука показывает рабочее окно, а не экран блокировки и не выключен?"
pdf_items: [11, 12]
owner: S4
# Первая запись — основная: её пункт идёт в описание жюри. Фраза (docs/legal_sources.md, раздел 6.2):
# «Может свидетельствовать о несоблюдении п. 73 пп. 6) <cite_ru TIB>.»
legal:
  - act_code: TIB
    act_title_ru: "Требования к обеспечению информационной безопасности банков, филиалов банков-нерезидентов Республики Казахстан и организаций, осуществляющих отдельные виды банковских операций"
    clause: "п. 73 пп. 6)"
    quote_ru: "недопущение работы в информационных системах под чужими учетными записями"
    url: "https://adilet.zan.kz/rus/docs/V2600038336"
    strength: indirect
    note_ru: "Незаблокированный компьютер в отсутствие кассира позволяет работать под его учётной записью. Прямой обязанности блокировать компьютер вручную в актах нет."
  - act_code: TIB
    act_title_ru: "Требования к обеспечению информационной безопасности банков, филиалов банков-нерезидентов Республики Казахстан и организаций, осуществляющих отдельные виды банковских операций"
    clause: "п. 71 пп. 9)"
    quote_ru: "при неактивности пользователя более 30 (тридцати) минут информационная система автоматически завершает сеанс работы пользователя либо блокирует рабочую станцию или ноутбук"
    url: "https://adilet.zan.kz/rus/docs/V2600038336"
    strength: indirect
    note_ru: "Только в интерфейсе, в описание жюри не идёт: автоблокировка через 30 минут — требование к системе, а не к кассиру."
