# NO_AUTH_CHECK — запись каталога v0 (P0-S0-05).
# Источник: docs/violation_catalog.md, раздел 2.6; нормы и сила — docs/legal_sources.md, раздел 5.1.
# title_ru — строка type для жюри, после сдачи не меняется. Шаблон, факты и вопрос VLM правит владелец кода, нормы — S5.
code: NO_AUTH_CHECK
title_ru: "Пропуск проверки подлинности банкнот"
group: cashops
verdict_impact: true
timecode_policy: omission_due  # конец пересчёта: деньги покидают зону машинки
# Описание = шаблон (str.format_map по фактам правила) + правовая фраза, которую добавляет pipeline/legal/describe.py.
template_ru: "Принятые наличные пересчитаны на счётной машинке (до {t_recount_end} с). Через детектор подлинности, который стоит на столе, они не проходят."
required_facts: [t_recount_end]
vlm_question_ru: "После пересчёта на машинке кассир не прогоняет купюры через отдельный детектор подлинности?"
pdf_items: [6]
owner: S5
# Первая запись — основная: её пункт идёт в описание жюри. Фраза (docs/legal_sources.md, раздел 6.2):
# «Может свидетельствовать о несоблюдении п. 19 пп. 2) <cite_ru PKO>.»
legal:
  - act_code: PKO
    act_title_ru: "Правила осуществления кассовых операций и операций по инкассации банкнот, монет и ценностей в банках второго уровня, филиалах банков-нерезидентов Республики Казахстан, Национальном операторе почты и юридических лицах, исключительной деятельностью которых является инкассация банкнот, монет и ценностей"
    clause: "п. 19 пп. 2)"
    quote_ru: "принимает банкноты с полистным пересчетом, монеты с пересчетом по кружкам с проверкой на подлинность и платежность наличных денег"
    url: "https://adilet.zan.kz/rus/docs/V1900019680"
    strength: indirect
    note_ru: "По разделу 7 связь прямая. Решение по умолчанию: из-за исключения п. 41 (машинка сама проверяет не менее двух защитных признаков) в каталоге косвенная, в описании «Может свидетельствовать о несоблюдении …»; окончательно — S5."
  - act_code: PKO
    act_title_ru: "Правила осуществления кассовых операций и операций по инкассации банкнот, монет и ценностей в банках второго уровня, филиалах банков-нерезидентов Республики Казахстан, Национальном операторе почты и юридических лицах, исключительной деятельностью которых является инкассация банкнот, монет и ценностей"
    clause: "п. 9"
    quote_ru: "Банк обеспечивает наличие специальных оборудований для определения платежности и подлинности банкнот при осуществлении кассовых операций."
    url: "https://adilet.zan.kz/rus/docs/V1900019680"
    strength: indirect
    note_ru: "Предложение S5: обязанность банка."
  - act_code: PKO
    act_title_ru: "Правила осуществления кассовых операций и операций по инкассации банкнот, монет и ценностей в банках второго уровня, филиалах банков-нерезидентов Республики Казахстан, Национальном операторе почты и юридических лицах, исключительной деятельностью которых является инкассация банкнот, монет и ценностей"
    clause: "п. 41"
    quote_ru: "на оборудовании, имеющем функцию проверки не менее двух машиночитаемых защитных признаков банкнот и монет"
    url: "https://adilet.zan.kz/rus/docs/V1900019680"
    strength: indirect
    note_ru: "Предложение S5. Исключение: если счётная машинка проверяет не менее двух защитных признаков, отдельный детектор не нужен; трактовка Х-44 под вопросом."
