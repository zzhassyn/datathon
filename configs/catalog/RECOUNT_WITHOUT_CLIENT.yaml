# RECOUNT_WITHOUT_CLIENT — запись каталога v0 (P0-S0-05).
# Источник: docs/violation_catalog.md, раздел 2.5; нормы и сила — docs/legal_sources.md, раздел 5.1.
# title_ru — строка type для жюри, после сдачи не меняется. Шаблон, факты и вопрос VLM правит владелец кода, нормы — S5.
code: RECOUNT_WITHOUT_CLIENT
title_ru: "Пересчёт не в присутствии клиента"
group: cashops
verdict_impact: true
timecode_policy: exit  # выход клиента
# Описание = шаблон (str.format_map по фактам правила) + правовая фраза, которую добавляет pipeline/legal/describe.py.
template_ru: "Клиент передаёт наличные и в {t_client_exit} с уходит из кассы, не дождавшись окончания пересчёта. {recount_note}"
# recount_note — из закрытого списка: «Деньги кладутся в счётную машинку в <t> с, уже после его ухода.» | «К моменту ухода пересчёт не начат.»
required_facts: [t_client_exit, recount_note]
vlm_question_ru: "Клиент уходит из кассы до того, как кассир закончила пересчёт его денег?"
pdf_items: [3]
owner: S5
# Первая запись — основная: её пункт идёт в описание жюри. Фраза (docs/legal_sources.md, раздел 6.2):
# «Основание: п. 20 ч. 1 <cite_ru PKO>.»
legal:
  - act_code: PKO
    act_title_ru: "Правила осуществления кассовых операций и операций по инкассации банкнот, монет и ценностей в банках второго уровня, филиалах банков-нерезидентов Республики Казахстан, Национальном операторе почты и юридических лицах, исключительной деятельностью которых является инкассация банкнот, монет и ценностей"
    clause: "п. 20 ч. 1"
    quote_ru: "Наличные деньги принимаются и пересчитываются кассовым работником в присутствии клиента."
    url: "https://adilet.zan.kz/rus/docs/V1900019680"
    strength: direct
